<!DOCTYPE html>
<html>
<head>
<title>Contact Us</title>
<style>
  body { font-family: sans-serif; margin: 20px; background-color: #f4f4f4; }
  form { background-color: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
  input[type="text"], input[type="email"], textarea { width: calc(100% - 22px); padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
  textarea { resize: vertical; height: 100px; }
  button[type="submit"] { background-color: #007bff; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
  button[type="submit"]:hover { background-color: #0056b3; }
  label { display: block; margin-bottom: 5px; font-weight: bold; }
</style>
</head>
<body>

    <h2>Contact Us</h2>

    <form action="https://api.web3forms.com/submit" method="POST">

        <input type="hidden" name="access_key" value="d8a82376-0cb9-42ba-b423-1f7c499faad7">

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
        </div>

        <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

        <button type="submit">Submit Form</button>

    </form>

</body>
</html>
